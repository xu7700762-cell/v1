[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biofoundation-v1"
version = "1.0.0"
description = "Locked BioFoundation FEMBA/A1 state and severity model reproduction"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "openpyxl==3.1.5",
  "joblib==1.5.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
